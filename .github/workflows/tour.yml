name: Tour des applis (émulateurs)

# Parcourt automatiquement tous les écrans accessibles des deux applis (téléphone + TV) et produit une galerie
# (artefact « tour-des-applis » : index.html, captures, ecrans.json). Sert à dresser la carte de l'appli pour le banc.
# Lancement à la main uniquement (onglet Actions). Mêmes règles de sécurité que le banc « Émulateurs ».
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée du tour par appli (minutes)"
        type: choice
        options: [ "12", "6", "20" ]
        default: "12"

permissions:
  contents: read

concurrency:
  group: tour-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tour:
    if: github.repository_owner == 'breizh-apps56612'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.7"
          cache-read-only: true

      # Sans les variables ANDROID_KEYSTORE_*, Gradle signe avec une clé de debug générée sur le runner.
      - name: Compiler les APK (clé de debug jetable)
        run: gradle --no-daemon :app:assembleRelease :box:assembleRelease

      - name: Activer KVM (accélération des émulateurs)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          true

      - name: Tour des applis
        timeout-minutes: 40
        env:
          APK_PHONE: app/build/outputs/apk/release/app-release.apk
          APK_BOX: box/build/outputs/apk/release/box-release.apk
          MINUTES: ${{ inputs.minutes }}
          OUT: ${{ runner.temp }}/tour
        run: bash tools/analyse/tour.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tour-des-applis
          path: ${{ runner.temp }}/tour
          retention-days: 7
          if-no-files-found: warn
