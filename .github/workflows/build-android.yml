name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.7"

      # Signature facultative : sans ces secrets, l'APK est signé avec la clé de debug (installable tel quel).
      - name: Décoder la clé de signature
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Tests unitaires + compilation
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          # Un seul secret à créer (ANDROID_KEYSTORE_BASE64) : la clé utilise les mots de passe standard d'une clé Android de debug.
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
          ANDROID_KEY_PASSWORD: android
        run: gradle --no-daemon testReleaseUnitTest :app:assembleRelease :box:assembleRelease

      - name: Renommer les APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Telecommande-telephone-${{ github.run_number }}.apk"
          cp box/build/outputs/apk/release/box-release.apk "Telecommande-Box-TV-${{ github.run_number }}.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Telecommande-apk
          path: Telecommande-*.apk
          retention-days: 30
