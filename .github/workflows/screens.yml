name: Captures du site

# Refait les captures d'écran du site (appli téléphone + appli Box) avec Robolectric.
# Se lance à la main (onglet Actions) ou quand un commit contient [screens].
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  screens:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.7"
      - name: Captures téléphone
        env:
          SCREENS: "1"
          SCREENS_DIR: ${{ github.workspace }}/screens
        run: gradle --no-daemon :app:testReleaseUnitTest --tests '*ScreenshotTest*' --tests '*RemoteTest.screenshots'
      - name: Captures TV
        env:
          SCREENS: "1"
          SCREENS_DIR: ${{ github.workspace }}/screens
        run: gradle --no-daemon :box:testReleaseUnitTest --tests '*TvScreenshotTest*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures
          path: screens
          retention-days: 7
