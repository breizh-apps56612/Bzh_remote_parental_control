name: Captures du site

# Refait les captures d'écran du site (appli téléphone + appli Box) avec Robolectric.
# Se lance à la main (onglet Actions) ou quand un commit contient [screens].
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  screens:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.7"
      - name: Captures téléphone
        env:
          SCREENS: "1"
          SCREENS_DIR: ${{ github.workspace }}/screens
        run: gradle --no-daemon :app:testReleaseUnitTest --tests '*ScreenshotTest*' --tests '*RemoteTest.screenshots'
      - name: Captures TV
        env:
          SCREENS: "1"
          SCREENS_DIR: ${{ github.workspace }}/screens
        run: gradle --no-daemon :box:testReleaseUnitTest --tests '*TvScreenshotTest*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures
          path: screens
          retention-days: 7
