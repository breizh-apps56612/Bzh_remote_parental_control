name: Émulateur en direct

# Téléphone + TV virtuels visibles et utilisables dans un navigateur (même sur téléphone), le temps d'une session.
# Le banc de test peut s'y dérouler sous vos yeux. Lien dans le résumé du run (et dans le journal de l'étape « Ouvrir »).
# Lancement à la main uniquement (onglet Actions › Émulateur en direct › Run workflow).
#
# Sécurité : page protégée par identifiant + mot de passe (secret EMULATEUR_MOT_DE_PASSE, jamais affiché),
# lien HTTPS temporaire qui disparaît à la fin du job, VNC limité à la machine, émulateurs vierges,
# droits en lecture seule, actions figées par empreinte, uniquement pour le propriétaire du dépôt.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de la session (minutes)"
        type: choice
        options: [ "45", "20", "90" ]
        default: "45"
      banc:
        description: "Jouer le banc de test en direct au début"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: emulateur-direct
  cancel-in-progress: false

jobs:
  direct:
    if: github.repository_owner == 'breizh-apps56612' && github.actor == 'breizh-apps56612'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.7"
          cache-read-only: true

      # Sans les variables ANDROID_KEYSTORE_*, Gradle signe avec une clé de debug générée sur le runner.
      - name: Compiler les APK (clé de debug jetable)
        run: gradle --no-daemon :app:assembleRelease :box:assembleRelease

      - name: Activer KVM (accélération des émulateurs)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tesseract-ocr >/dev/null

      - name: Ouvrir (lien dans le résumé)
        timeout-minutes: 20
        env:
          MOT_DE_PASSE: ${{ secrets.EMULATEUR_MOT_DE_PASSE }}
          APK_PHONE: app/build/outputs/apk/release/app-release.apk
          APK_BOX: box/build/outputs/apk/release/box-release.apk
          OUT: ${{ runner.temp }}/direct
        run: bash tools/analyse/direct.sh ouvrir

      - name: Session en direct
        timeout-minutes: 95
        env:
          MINUTES: ${{ inputs.minutes }}
          BANC: ${{ inputs.banc }}
          APK_PHONE: app/build/outputs/apk/release/app-release.apk
          APK_BOX: box/build/outputs/apk/release/box-release.apk
          OUT: ${{ runner.temp }}/direct
        run: |
          fin=$(( $(date +%s) + MINUTES * 60 ))
          if [ "$BANC" = "true" ]; then
            sleep 90   # le temps d'ouvrir le lien
            EMU_DEJA_LA=1 KEEP=1 VIDEO=0 OUT="$OUT/banc" bash tools/analyse/ci-emulateurs.sh || true
            cat "$OUT/banc/resume.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          while [ "$(date +%s)" -lt "$fin" ]; do sleep 30; done
          echo "Fin de la session."
